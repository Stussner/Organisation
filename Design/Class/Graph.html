<!-- Komponente: Graph | Zweck: Netz aus Knoten und gerichteten Verbindungen. -->
<svg viewBox="0 0 500 220" role="img" aria-labelledby="graph-title graph-description" xmlns="http://www.w3.org/2000/svg">
  <title id="graph-title">Beispielgraph</title>
  <desc id="graph-description">Drei Knoten mit gerichteten Verbindungen.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="currentColor" />
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)">
    <path d="M125 105 L235 105" />
    <path d="M265 105 L375 65" />
    <path d="M265 120 L375 160" />
  </g>
  <g fill="currentColor" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">
    <circle cx="100" cy="105" r="28" /><circle cx="250" cy="105" r="28" />
    <circle cx="400" cy="55" r="28" /><circle cx="400" cy="170" r="28" />
  </g>
  <g fill="white" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Arial, sans-serif">
    <text x="100" y="105">A</text><text x="250" y="105">B</text>
    <text x="400" y="55">C</text><text x="400" y="170">D</text>
  </g>
</svg>
