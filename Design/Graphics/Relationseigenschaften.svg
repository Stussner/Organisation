<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" role="img" aria-labelledby="title desc">
  <title id="title">Eigenschaften von Relationen und Graphen</title><desc id="desc">Symmetrische Verbindung, transitive Folge und zwei getrennte Komponenten.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#70f0ad"/></marker><style>.e{stroke:#70f0ad;stroke-width:2.5}.d{stroke:#e3c064;stroke-width:2;stroke-dasharray:6 5}.n{fill:#123629;stroke:#9affc5;stroke-width:2}.t{fill:#edf9f1;font:600 12px 'Segoe UI',sans-serif}.s{fill:#b1d8c2;font:12px 'Segoe UI',sans-serif}</style></defs>
  <g transform="translate(25 35)"><text class="t" x="20" y="0">symmetrisch</text><line class="e" marker-start="url(#a)" marker-end="url(#a)" x1="28" y1="55" x2="110" y2="55"/><circle class="n" cx="15" cy="55" r="14"/><circle class="n" cx="123" cy="55" r="14"/></g>
  <g transform="translate(175 35)"><text class="t" x="38" y="0">transitiv</text><line class="e" marker-end="url(#a)" x1="20" y1="55" x2="74" y2="55"/><line class="e" marker-end="url(#a)" x1="90" y1="55" x2="144" y2="55"/><path class="d" marker-end="url(#a)" fill="none" d="M20 70C60 112 116 112 144 70"/><circle class="n" cx="10" cy="55" r="12"/><circle class="n" cx="80" cy="55" r="12"/><circle class="n" cx="154" cy="55" r="12"/></g>
  <g transform="translate(360 35)"><text class="t" x="3" y="0">2 Komponenten</text><line class="e" x1="12" y1="48" x2="50" y2="75"/><line class="e" x1="78" y1="48" x2="116" y2="75"/><circle class="n" cx="10" cy="45" r="11"/><circle class="n" cx="52" cy="78" r="11"/><circle class="n" cx="76" cy="45" r="11"/><circle class="n" cx="118" cy="78" r="11"/></g>
  <text class="s" x="142" y="196">Relationseigenschaft ≠ einzelne Kanteneigenschaft</text>
</svg>
