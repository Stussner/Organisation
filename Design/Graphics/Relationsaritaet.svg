  <title id="title">Arität von Relationen</title><desc id="desc">Unäre, binäre, ternäre und n-äre Relationen als unterschiedliche Beteiligtenzahlen.</desc>
  <defs><style>.n{fill:#123629;stroke:#9affc5;stroke-width:2}.r{fill:#276c52;stroke:#70f0ad;stroke-width:2}.e{stroke:#70f0ad;stroke-width:2}.t{fill:#edf9f1;font:600 13px 'Segoe UI',sans-serif}.s{fill:#b1d8c2;font:12px 'Segoe UI',sans-serif}</style></defs>
  <g transform="translate(55 100)"><circle class="r" r="14"/><circle class="n" cy="-42" r="12"/><line class="e" y1="-14" y2="-30"/><text class="t" x="-15" y="72">unär</text></g>
  <g transform="translate(170 100)"><circle class="r" r="14"/><circle class="n" cx="-31" cy="-35" r="12"/><circle class="n" cx="31" cy="-35" r="12"/><line class="e" x1="-10" y1="-10" x2="-24" y2="-26"/><line class="e" x1="10" y1="-10" x2="24" y2="-26"/><text class="t" x="-18" y="72">binär</text></g>
  <g transform="translate(295 100)"><circle class="r" r="14"/><circle class="n" cx="-37" cy="-31" r="12"/><circle class="n" cy="-48" r="12"/><circle class="n" cx="37" cy="-31" r="12"/><line class="e" x1="-11" y1="-9" x2="-28" y2="-24"/><line class="e" y1="-14" y2="-36"/><line class="e" x1="11" y1="-9" x2="28" y2="-24"/><text class="t" x="-20" y="72">ternär</text></g>
  <g transform="translate(420 100)"><ellipse class="r" rx="34" ry="24"/><circle class="n" cx="-38" cy="-38" r="9"/><circle class="n" cy="-50" r="9"/><circle class="n" cx="38" cy="-38" r="9"/><circle class="n" cx="-46" cy="10" r="9"/><circle class="n" cx="46" cy="10" r="9"/><path class="e" d="M-28-17-34-30M0-24V-41M28-17 34-30M-34 5-37 8M34 5 37 8"/><text class="t" x="-14" y="72">n-är</text></g>
  <text class="s" x="17" y="20">Arität = Zahl gemeinsam beteiligter Elemente</text>
