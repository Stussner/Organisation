<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" role="img" aria-labelledby="title desc">
  <title id="title">Baum und gerichteter azyklischer Graph</title><desc id="desc">Links ein Baum mit eindeutigen Eltern, rechts ein DAG mit mehreren Vorgängern.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#70f0ad"/></marker><style>.e{stroke:#70f0ad;stroke-width:2.5}.n{fill:#123629;stroke:#9affc5;stroke-width:2}.t{fill:#edf9f1;font:600 14px 'Segoe UI',sans-serif}.s{fill:#b1d8c2;font:12px 'Segoe UI',sans-serif}</style></defs>
  <text class="t" x="95" y="24">Baum</text><line class="e" x1="120" y1="55" x2="70" y2="110"/><line class="e" x1="120" y1="55" x2="170" y2="110"/><line class="e" x1="70" y1="110" x2="40" y2="165"/><line class="e" x1="70" y1="110" x2="100" y2="165"/><line class="e" x1="170" y1="110" x2="190" y2="165"/>
  <g class="n"><circle cx="120" cy="45" r="12"/><circle cx="70" cy="105" r="12"/><circle cx="170" cy="105" r="12"/><circle cx="40" cy="165" r="12"/><circle cx="100" cy="165" r="12"/><circle cx="190" cy="165" r="12"/></g>
  <text class="t" x="330" y="24">DAG</text><line class="e" marker-end="url(#a)" x1="300" y1="52" x2="330" y2="95"/><line class="e" marker-end="url(#a)" x1="400" y1="52" x2="370" y2="95"/><line class="e" marker-end="url(#a)" x1="342" y1="113" x2="310" y2="158"/><line class="e" marker-end="url(#a)" x1="358" y1="113" x2="405" y2="158"/><line class="e" marker-end="url(#a)" x1="300" y1="52" x2="398" y2="157"/>
  <g class="n"><circle cx="295" cy="42" r="12"/><circle cx="405" cy="42" r="12"/><circle cx="350" cy="105" r="12"/><circle cx="300" cy="169" r="12"/><circle cx="415" cy="169" r="12"/></g>
  <text class="s" x="260" y="198">mehrere Vorgänger, kein Zyklus</text>
</svg>
